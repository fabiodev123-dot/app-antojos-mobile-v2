<!doctype html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antojos · Resumen semanal (Vercel-style)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-soft: #111111;
    --card: #141414;
    --border: #1f1f1f;
    --border-soft: #2a2a2a;
    --fg: #fafafa;
    --fg-muted: #888;
    --fg-dim: #555;
    --accent: #ffcc00;
    --success: #00d68f;
    --today-bg: #1a1a00;
    --today-border: #ffcc00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .frame {
    max-width: 380px;
    margin: 0 auto;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .frame-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(255,204,0,0.04) 0%, transparent 100%);
  }
  .frame-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
  }
  .frame-title svg { color: var(--accent); }
  .frame-meta {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    font-weight: 500;
  }
  .week-list { list-style: none; }
  .day-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid #181818;
    transition: background 0.15s;
  }
  .day-row:last-child { border-bottom: none; }
  .day-row.is-today {
    background: var(--today-bg);
    margin: 0 -4px;
    padding: 10px 20px;
    border-radius: 6px;
    border: 1px solid var(--today-border);
  }
  .day-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .day-name {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-muted);
    width: 28px;
  }
  .is-today .day-name { color: var(--accent); }
  .day-num {
    font-family: 'Geist Mono', monospace;
    font-size: 14px;
    color: var(--fg);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .is-today .day-num { font-weight: 600; }
  .day-count {
    font-size: 10px;
    color: var(--fg-dim);
    margin-left: 4px;
  }
  .day-total {
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  .day-total.is-zero { color: var(--fg-dim); font-weight: 500; }
  .bar {
    height: 2px;
    background: var(--border-soft);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
    width: 60px;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s;
  }
  .week-total {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-top: 1px solid var(--border-soft);
    background: var(--bg);
  }
  .week-total-label {
    font-size: 12px;
    color: var(--fg-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .week-total-value {
    font-family: 'Geist Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--success);
    font-variant-numeric: tabular-nums;
  }
  .legend {
    text-align: center;
    margin-top: 14px;
    font-size: 11px;
    color: var(--fg-muted);
  }
  .legend kbd {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 10px;
    color: var(--fg);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="frame-header">
      <div class="frame-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Esta semana
      </div>
      <div class="frame-meta">17–23 ago</div>
    </div>

    <ul class="week-list">
      <li class="day-row">
        <div class="day-left">
          <span class="day-name">Lun</span>
          <span class="day-num">17</span>
          <span class="day-count">· 3 ped.</span>
        </div>
        <div style="text-align: right;">
          <div class="day-total">$ 8.500</div>
          <div class="bar"><div class="bar-fill" style="width: 60%;"></div></div>
        </div>
      </li>
      <li class="day-row">
        <div class="day-left">
          <span class="day-name">Mar</span>
          <span class="day-num">18</span>
          <span class="day-count">· 5 ped.</span>
        </div>
        <div style="text-align: right;">
          <div class="day-total">$ 14.200</div>
          <div class="bar"><div class="bar-fill" style="width: 100%;"></div></div>
        </div>
      </li>
      <li class="day-row">
        <div class="day-left">
          <span class="day-name">Mié</span>
          <span class="day-num">19</span>
          <span class="day-count">· 2 ped.</span>
        </div>
        <div style="text-align: right;">
          <div class="day-total">$ 4.300</div>
          <div class="bar"><div class="bar-fill" style="width: 30%;"></div></div>
        </div>
      </li>
      <li class="day-row">
        <div class="day-left">
          <span class="day-name">Jue</span>
          <span class="day-num">20</span>
          <span class="day-count"></span>
        </div>
        <div style="text-align: right;">
          <div class="day-total is-zero">$ 0</div>
        </div>
      </li>
      <li class="day-row is-today">
        <div class="day-left">
          <span class="day-name">Vie</span>
          <span class="day-num">21</span>
          <span class="day-count">· 4 ped.</span>
        </div>
        <div style="text-align: right;">
          <div class="day-total">$ 9.750</div>
          <div class="bar"><div class="bar-fill" style="width: 68%;"></div></div>
        </div>
      </li>
      <li class="day-row">
        <div class="day-left">
          <span class="day-name">Sáb</span>
          <span class="day-num">22</span>
        </div>
        <div style="text-align: right;">
          <div class="day-total is-zero">$ 0</div>
        </div>
      </li>
      <li class="day-row">
        <div class="day-left">
          <span class="day-name">Dom</span>
          <span class="day-num">23</span>
        </div>
        <div style="text-align: right;">
          <div class="day-total is-zero">$ 0</div>
        </div>
      </li>
    </ul>

    <div class="week-total">
      <div class="week-total-label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        Total semana · 14 ped.
      </div>
      <div class="week-total-value">$ 36.750</div>
    </div>
  </div>

  <p class="legend">
    Variant <kbd>A</kbd> · Vercel-style minimal · B/N con acento amarillo
  </p>
</body>
</html>
