# Render.com infrastructure config for app-antojos-mobile
#
# Setup:
# 1. Ir a https://render.com → New + → Web Service
# 2. Conectar repo: fabiodev123-dot/app-antojos-mobile
# 3. Render detecta este archivo y aplica la config
# 4. Setear las 3 env vars SECRETAS manualmente (NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, SUPABASE_SERVICE_ROLE_KEY, DATABASE_URL)
# 5. Manual Deploy → Deploy latest commit
#
# Notas:
# - Plan free: se duerme después de 15 min sin tráfico. GitHub Actions cron
#   (/.github/workflows/keep-alive.yml) hace ping cada 14 min para evitar el sleep.
# - Para que el cron funcione gratis, el fork debe ser público.

services:
  - type: web
    name: app-antojos-mobile
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.x
      - key: NEXT_PUBLIC_DATA_SOURCE
        value: supabase
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
        value: https://zriwcsczgnjrsdjmudab.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        value: https://zriwcsczgnjrsdjmudab.supabase.co/auth/v1/.well-known/jwks.json
    buildFilter:
      paths:
        - "**/*"
        - "!docs/**"
        - "!sketches/**"
        - "!.hermes/**"